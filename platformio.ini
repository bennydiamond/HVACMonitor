[platformio]
default_envs = esp32_idf5_arduino, esp32_idf5_arduino_ota

[env]
extra_scripts =
    pre:scripts/compress_web_assets.py
    pre:scripts/git_version.py

[env:esp32_idf5_arduino]
extra_scripts =
    pre:scripts/compress_web_assets.py
    pre:scripts/git_version.py
platform = espressif32 @ 8.0.0
board = esp32dev
framework = espidf, arduino
board_build.partitions = partitions_no_spiffs.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 19200
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@~8.4.0
    knolleary/PubSubClient@^2.8
    sensirion/Sensirion Gas Index Algorithm
    bitbucket-christandlg/BMx280MI
build_flags =
    -I src
    -I HVAC_NanoSensorHub/include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINOHA_MAXPROGMEM_STRINGS
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wno-unused-function
    -DNDEBUG
    -L lib/zmod4510 -l_no2_o3
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -DBMP280_ENABLED
    -DSERIAL_BAUD_RATE=19200
    -DLV_USE_PERF_MONITOR=1
    -DARDUINO_LOOP_STACK_SIZE=4096
    -DENABLE_TASK_WATCHDOG
    ; PubSubClient's wait for the broker's reply (default 15 s, blocks the main loop)
    -DMQTT_SOCKET_TIMEOUT=2
    ; Suppress GCC 14.2 / -O2 false-positive in third-party LovyanGFX std::sort (Touch_XPT2046.inl, GCC Bugzilla PR109590)
    -Wno-array-bounds
    -O2
; Must be absolute: the bootloader CMake subproject resolves relative paths against its own
; source dir, silently falls back to Kconfig defaults (e.g. DIO flash mode) if not found.
board_build.esp-idf.sdkconfig_path = ${PROJECT_DIR}/sdkconfig.esp32_idf5_arduino

[env:esp32_idf5_arduino_ota]
extends = env:esp32_idf5_arduino
upload_protocol = espota
upload_port = 192.168.1.113
upload_flags = --host_port=32320



