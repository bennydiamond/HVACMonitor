[platformio]
default_envs = esp32_2432s022c, esp32_ota

[env:esp32_2432s022c]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = partitions_no_spiffs.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 19200
;monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@~8.4.0
    knolleary/PubSubClient@^2.8
    arcao/Syslog
    marian-craciunescu/esp32ping
    sensirion/Sensirion Gas Index Algorithm
    bitbucket-christandlg/BMx280MI
build_flags =
    -I src
    -I HVAC_NanoSensorHub/include
    -Wl,-Map,firmware.map
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINOHA_MAXPROGMEM_STRINGS
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wno-unused-function
    -DNDEBUG
    -L lib/zmod4510 -l_no2_o3
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
;    -DAHT20_ENABLED
    -DBMP280_ENABLED
;    -DSERIAL_OUT_DEBUG
    -DSERIAL_BAUD_RATE=${env:esp32_2432s022c.monitor_speed}
;    -DSERIAL_PACKET_DEBUG
    -DLV_USE_PERF_MONITOR=1
    -DARDUINO_LOOP_STACK_SIZE=4096
    -DENABLE_TASK_WATCHDOG
    -O2
build_unflags=
    -std=gnu++11
    -Os

[env:esp32_ota]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = ${env:esp32_2432s022c.board_build.partitions}
board_build.f_cpu = ${env:esp32_2432s022c.board_build.f_cpu}
board_build.f_flash = ${env:esp32_2432s022c.board_build.f_flash}
board_build.flash_mode = ${env:esp32_2432s022c.board_build.flash_mode}
upload_protocol = espota
upload_port = 192.168.1.113
upload_flags = --host_port=32320
monitor_speed = ${env:esp32_2432s022c.monitor_speed}
lib_deps = ${env:esp32_2432s022c.lib_deps}
build_flags = ${env:esp32_2432s022c.build_flags}
build_unflags = ${env:esp32_2432s022c.build_unflags}

[env:esp32_8_0_0]
extends = env:esp32_2432s022c
platform = espressif32 @ 8.0.0

[env:esp32_8_0_0_ota]
extends = env:esp32_8_0_0
upload_protocol = espota
upload_port = 192.168.1.113
upload_flags = --host_port=32320

[env:esp32_lean_idf5]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = espidf, arduino
board_build.partitions = partitions_no_spiffs.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 19200
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@~8.4.0
    knolleary/PubSubClient@^2.8
    arcao/Syslog
    marian-craciunescu/esp32ping
    sensirion/Sensirion Gas Index Algorithm
    bitbucket-christandlg/BMx280MI
build_flags =
    -I src
    -I HVAC_NanoSensorHub/include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINOHA_MAXPROGMEM_STRINGS
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wno-unused-function
    -DNDEBUG
    -L lib/zmod4510 -l_no2_o3
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -DBMP280_ENABLED
    -DSERIAL_BAUD_RATE=19200
    -DLV_USE_PERF_MONITOR=1
    -DARDUINO_LOOP_STACK_SIZE=4096
    -DENABLE_TASK_WATCHDOG
    ; Suppress GCC 14.2 / -O2 false-positive in third-party LovyanGFX std::sort (Touch_XPT2046.inl, GCC Bugzilla PR109590)
    -Wno-array-bounds
    -O2
; Must be absolute: the bootloader CMake subproject resolves relative paths against its own
; source dir, silently falls back to Kconfig defaults (e.g. DIO flash mode) if not found.
board_build.esp-idf.sdkconfig_path = ${PROJECT_DIR}/sdkconfig.esp32_lean_idf5

[env:esp32_lean_idf5_ota]
extends = env:esp32_lean_idf5
upload_protocol = espota
upload_port = 192.168.1.113
upload_flags = --host_port=32320



